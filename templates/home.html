<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111218" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>SpicyPy</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0f1015;color:#f6f7fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:rgba(15,16,21,.94);border-bottom:1px solid #262934;backdrop-filter:blur(16px)}.brand{font-size:20px;font-weight:850}.nav{display:flex;gap:8px}.nav a{color:#fff;text-decoration:none;background:#21232b;border:1px solid #2c2f3b;padding:9px 13px;border-radius:11px}.hero{max-width:1400px;margin:auto;padding:28px 20px 18px}.hero h1{font-size:clamp(28px,4vw,44px);margin:0 0 7px}.hero p{margin:0;color:#989faf}.controls{max-width:1400px;margin:auto;padding:0 20px 16px;display:grid;gap:12px}.search-row{display:grid;grid-template-columns:1fr 160px 160px;gap:10px}.field{width:100%;background:#171920;color:#fff;border:1px solid #30333f;border-radius:12px;padding:12px 14px;outline:none}.field:focus{border-color:#7457ff}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:3px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #30333f;background:#171920;color:#bec3d0;border-radius:999px;padding:8px 12px}.chip.active{background:#7357ff;border-color:#7357ff;color:#fff}.summary{max-width:1400px;margin:auto;padding:0 20px 12px;color:#9299aa;font-size:14px}.grid{max-width:1400px;margin:auto;padding:0 20px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.card{background:#171920;border:1px solid #282b35;border-radius:16px;overflow:hidden;transition:.2s ease;min-width:0}.card:hover{transform:translateY(-3px);border-color:#5c49ba}.cover{aspect-ratio:1/1.14;background:#20232b;position:relative;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:10px;left:10px;background:rgba(9,10,14,.78);padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.body{padding:12px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.creator{font-size:12px;color:#8d94a5;margin-top:3px}.desc{font-size:13px;color:#c0c5d0;line-height:1.4;height:38px;overflow:hidden;margin-top:8px}.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#9097a7}.tags{display:flex;gap:5px;flex-wrap:wrap;max-height:49px;overflow:hidden;margin-top:9px}.tag{background:#232631;color:#b8becc;border-radius:999px;padding:4px 7px;font-size:10px}.more{display:block;margin:0 auto 100px;border:1px solid #343743;background:#1b1d25;color:#fff;border-radius:12px;padding:11px 18px}.loading,.empty{grid-column:1/-1;text-align:center;color:#949bab;padding:40px}.bottomnav{display:none}
    @media(max-width:700px){.topbar{padding:10px 12px}.nav{display:none}.hero{padding:20px 12px 14px}.hero p{font-size:13px}.controls{padding:0 12px 12px}.search-row{grid-template-columns:1fr 1fr}.search-row input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:0 10px 90px}.summary{padding:0 12px 10px}.card{border-radius:13px}.body{padding:9px}.name{font-size:14px}.desc{font-size:12px;height:34px}.cover{aspect-ratio:1/1.18}.bottomnav{position:fixed;z-index:40;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;background:rgba(17,18,24,.96);border-top:1px solid #2a2d36;padding:7px 10px max(7px,env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.bottomnav a{color:#b6bdca;text-align:center;text-decoration:none;padding:7px;border-radius:10px}.bottomnav a.active{color:#fff;background:#22252e}}
  </style>
</head>
<body>
<header class="topbar"><div class="brand">🌶️ SpicyPy</div><nav class="nav"><a href="/">Home</a><a href="/chat">Chats</a><a href="/logout">Logout</a></nav></header>
<section class="hero"><h1>Temukan karakter</h1><p>Jelajahi katalog karakter dengan pencarian, tag, popularitas, rating, dan mode konten.</p></section>
<section class="controls">
  <div class="search-row"><input id="search" class="field" placeholder="Cari nama, tag, creator..."/><select id="content" class="field"><option value="all">Semua</option><option value="sfw">SFW</option><option value="nsfw">NSFW</option></select><select id="sort" class="field"><option value="trending">Trending</option><option value="popular">Popular</option><option value="rating">Rating</option></select></div>
  <div class="chips" id="chips"></div>
</section>
<div class="summary" id="summary">Memuat karakter...</div>
<section class="grid" id="grid"><div class="loading">Memuat...</div></section>
<button class="more" id="more" style="display:none">Muat lebih banyak</button>
<nav class="bottomnav"><a class="active" href="/">⌂<br><small>Home</small></a><a href="/chat">☰<br><small>Chats</small></a></nav>
<script>
const tags=['Female','Male','Anime','Original Character','RPG','Adventure','Fantasy','Scenario','Multiple Characters','AI Assistant','Real','Dominant','Romance','Action','English'];
let selected=[],page=1,busy=false,total=0;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function avatar(c){return c.avatar_url?'/api/avatar?url='+encodeURIComponent(c.avatar_url):''}
function renderChips(){$('chips').innerHTML='';tags.forEach(t=>{const b=document.createElement('button');b.className='chip'+(selected.includes(t)?' active':'');b.textContent=t;b.onclick=()=>{selected=selected.includes(t)?selected.filter(x=>x!==t):[...selected,t];page=1;renderChips();load(false)};$('chips').appendChild(b)})}
function compact(n){n=Number(n||0);if(n>=1e6)return(n/1e6).toFixed(1)+'m';if(n>=1e3)return(n/1e3).toFixed(1)+'k';return String(n)}
function card(c){const el=document.createElement('article');el.className='card';const ctags=Array.isArray(c.tags)?c.tags.slice(0,5):[];el.innerHTML='<div class="cover"><img loading="lazy" src="'+esc(avatar(c))+'" alt=""><span class="badge">'+(c.is_nsfw?'NSFW':'SFW')+'</span></div><div class="body"><div class="name">'+esc(c.name||'Unknown')+'</div><div class="creator">@'+esc(c.creator_username||'unknown')+'</div><div class="desc">'+esc(c.title||'')+'</div><div class="meta"><span>💬 '+compact(c.num_messages)+'</span><span>★ '+esc(Math.round(Number(c.rating_score||0)))+'%</span></div><div class="tags">'+ctags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div>';el.onclick=()=>{sessionStorage.setItem('pendingCharacter',JSON.stringify(c));location.href='/chat'};return el}
async function load(append){if(busy)return;busy=true;if(!append)$('grid').innerHTML='<div class="loading">Memuat...</div>';const p=new URLSearchParams({search:$('search').value.trim()||'*',nsfw:$('content').value,sort:$('sort').value,page:String(page),per_page:'24'});selected.forEach(t=>p.append('tag',t));try{const r=await fetch('/api/characters?'+p);const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Gagal memuat');total=d.total||0;if(!append)$('grid').innerHTML='';(d.characters||[]).forEach(c=>$('grid').appendChild(card(c)));$('summary').textContent=total.toLocaleString('id-ID')+' karakter ditemukan';$('more').style.display=page*24<total?'block':'none';if(!(d.characters||[]).length&&!append)$('grid').innerHTML='<div class="empty">Tidak ada karakter ditemukan.</div>'}catch(e){$('grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}finally{busy=false}}
let timer;$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load(false)},350)});$('content').onchange=$('sort').onchange=()=>{page=1;load(false)};$('more').onclick=()=>{page++;load(true)};renderChips();load(false);if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
</script>
</body>
</html>
