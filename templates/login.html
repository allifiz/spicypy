<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpicyChat - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 14px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .info {
            background: #e7f3ff;
            color: #0066cc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="loading" id="loadingScreen">
            <div class="spinner"></div>
            <p>Memeriksa sesi login...</p>
        </div>
        
        <div id="loginForm" style="display: none;">
            <h1>🌶️ SpicyChat</h1>
            <p class="subtitle">Web Interface</p>
            
            <div class="info">
                💡 <strong>Cara dapat refresh_token:</strong><br>
                1. Buka spicychat.ai dan login<br>
                2. Tekan F12 → Tab Network<br>
                3. Cari request ke auth.spicychat.ai<br>
                4. Copy refresh_token dari payload
            </div>
            
            <div class="error" id="error"></div>
            
            <form id="form">
                <div class="form-group">
                    <label for="refresh_token">Refresh Token</label>
                    <input type="password" id="refresh_token" required placeholder="Paste refresh_token di sini">
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe" checked>
                    <label for="rememberMe">Ingat saya (auto-login besok)</label>
                </div>
                
                <button type="submit" id="submitBtn">Login</button>
            </form>
        </div>
    </div>

    <script>
        // Cek apakah ada token tersimpan saat halaman load
        window.addEventListener('DOMContentLoaded', async () => {
            const savedToken = localStorage.getItem('spicychat_refresh_token');
            
            if (savedToken) {
                // Ada token tersimpan, coba auto-login
                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh_token: savedToken })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Auto-login berhasil, redirect ke chat
                        window.location.href = '/';
                    } else {
                        // Token expired atau invalid, tampilkan form login
                        showLoginForm();
                    }
                } catch (err) {
                    // Error, tampilkan form login
                    showLoginForm();
                }
            } else {
                // Tidak ada token tersimpan, tampilkan form login
                showLoginForm();
            }
        });
        
        function showLoginForm() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }
        
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('error');
            const token = document.getElementById('refresh_token').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            btn.disabled = true;
            btn.textContent = 'Logging in...';
            errorDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: token })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Simpan token di localStorage jika "Remember Me" dicentang
                    if (rememberMe) {
                        localStorage.setItem('spicychat_refresh_token', token);
                    }
                    
                    window.location.href = '/';
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                errorDiv.textContent = '❌ ' + err.message;
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
