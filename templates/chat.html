<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111218" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>SpicyPy Chat</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f1015;color:#f5f6fa;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}
    button,textarea,input{font:inherit}.app{height:100dvh;display:grid;grid-template-columns:300px 1fr}.sidebar{background:#15161d;border-right:1px solid #272934;display:flex;flex-direction:column;min-width:0}.side-head{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #272934}.brand{font-weight:800}.home-btn,.icon-btn{border:0;background:#232631;color:#fff;border-radius:10px;padding:9px 11px;cursor:pointer}.conversation-list{overflow:auto;padding:8px}.convo{padding:11px;border-radius:12px;cursor:pointer}.convo:hover{background:#21232c}.convo-name{font-weight:650;font-size:14px}.convo-preview{font-size:12px;color:#9da3b4;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chat{display:flex;flex-direction:column;min-width:0;min-height:0}.chat-top{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #242731;background:#121319}.char-info{display:flex;align-items:center;gap:11px;min-width:0}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#292b35}.char-meta{min-width:0}.char-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.char-sub{font-size:12px;color:#8f96a7}.top-actions{display:flex;gap:8px}.model-pill{display:flex;align-items:center;gap:7px;max-width:220px;border:1px solid #30333e;background:#1a1c24;color:#fff;border-radius:11px;padding:8px 11px;cursor:pointer}.model-pill .dot{width:7px;height:7px;border-radius:999px;background:#7c5cff;flex:none}.model-pill .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}.messages{flex:1;overflow:auto;padding:24px max(20px,calc((100% - 850px)/2));display:flex;flex-direction:column;gap:18px;min-height:0}.empty{margin:auto;text-align:center;color:#8e95a6;max-width:360px}.msg{display:flex;gap:10px;max-width:780px}.msg.user{align-self:flex-end;flex-direction:row-reverse}.bubble{background:#1b1d25;border:1px solid #2b2e39;border-radius:16px;padding:12px 14px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word}.msg.user .bubble{background:#6c4cff;border-color:#6c4cff}.msg.error .bubble{color:#ffb4b4;border-color:#633}.composer-wrap{flex:none;padding:12px max(14px,calc((100% - 900px)/2)) max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(15,16,21,0),#0f1015 24%)}.composer{display:flex;align-items:flex-end;gap:8px;border:1px solid #30333e;background:#171820;border-radius:18px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.28)}.composer textarea{flex:1;resize:none;max-height:150px;min-height:42px;border:0;outline:0;background:transparent;color:#fff;padding:10px 8px;font:inherit}.composer button{width:42px;height:42px;border:0;border-radius:12px;background:#262934;color:#fff;font-weight:800;font-size:17px;cursor:pointer;flex:none}.composer .send{background:#7357ff}.composer button:disabled{opacity:.5}.mobile-menu{display:none}.drawer-backdrop{display:none}
    .sheet-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;padding:20px}.sheet-backdrop.show{display:flex;align-items:center;justify-content:center}.model-sheet{width:min(760px,100%);max-height:min(82vh,760px);background:#15171f;border:1px solid #2c303b;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45)}.sheet-head{padding:18px 18px 12px;border-bottom:1px solid #282b35;display:flex;justify-content:space-between;gap:12px;align-items:center}.sheet-title{font-size:18px;font-weight:800}.sheet-sub{font-size:12px;color:#9299aa;margin-top:3px}.close-sheet{width:36px;height:36px;border:0;border-radius:10px;background:#232631;color:#fff;cursor:pointer}.model-search{padding:12px 16px;border-bottom:1px solid #252832}.model-search input{width:100%;border:1px solid #303440;background:#101218;color:#fff;border-radius:12px;padding:11px 13px;outline:none}.model-search input:focus{border-color:#755cff}.model-list{overflow:auto;padding:10px}.model-card{width:100%;text-align:left;border:1px solid #292d37;background:#191b23;color:#fff;border-radius:14px;padding:14px;margin-bottom:9px;cursor:pointer}.model-card:hover,.model-card.active{border-color:#7158f5;background:#1d1b2b}.model-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.model-name{font-weight:800;font-size:15px}.model-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.badge{font-size:10px;border:1px solid #343846;color:#b8bfd0;border-radius:999px;padding:4px 7px}.badge.access{border-color:#5a4a8f;color:#c9bfff}.badge.new{border-color:#416f5a;color:#9ee6bd}.model-desc{font-size:12px;line-height:1.5;color:#9fa6b8;margin-top:9px}.model-check{font-size:18px;color:#8d7aff;min-width:22px;text-align:right}.model-empty{padding:30px;text-align:center;color:#969dac}.settings-hint{padding:10px 16px 16px;color:#8d94a6;font-size:11px}
    @media(max-width:768px){.app{display:block}.sidebar{position:fixed;inset:0 14% 0 0;z-index:50;transform:translateX(-105%);transition:.22s ease;box-shadow:20px 0 50px rgba(0,0,0,.45)}.sidebar.open{transform:none}.drawer-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}.mobile-menu{display:inline-grid;place-items:center}.chat{height:100dvh}.chat-top{height:58px;padding:0 10px}.avatar{width:36px;height:36px}.char-sub{display:none}.top-actions .hide-mobile{display:none}.model-pill{max-width:126px;padding:7px 9px}.model-pill .label{font-size:12px}.messages{padding:16px 12px}.msg{max-width:92%}.bubble{font-size:14px}.composer-wrap{padding:8px 8px max(8px,env(safe-area-inset-bottom))}.composer{border-radius:16px}.composer textarea{font-size:16px}.composer button{width:40px;height:40px}.home-btn{padding:8px 10px}.sheet-backdrop{padding:0;align-items:flex-end!important}.model-sheet{width:100%;max-height:86dvh;border-radius:20px 20px 0 0;border-bottom:0}.sheet-head{padding-top:16px}.model-list{padding-bottom:max(16px,env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
<div class="drawer-backdrop" id="backdrop"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head"><div class="brand">🌶️ SpicyPy</div><button class="home-btn" onclick="location.href='/'">Home</button></div>
    <div class="conversation-list" id="conversationList"><div class="convo-preview" style="padding:12px">Memuat chat...</div></div>
  </aside>
  <main class="chat">
    <header class="chat-top">
      <div class="char-info"><button class="icon-btn mobile-menu" id="menuBtn">☰</button><img id="charAvatar" class="avatar" alt="avatar"><div class="char-meta"><div id="charName" class="char-name">Pilih karakter</div><div id="charSub" class="char-sub">Mulai dari Home</div></div></div>
      <div class="top-actions">
        <button class="model-pill" id="modelBtn" title="Pilih model"><span class="dot"></span><span class="label" id="modelLabel">Model</span></button>
        <button class="icon-btn hide-mobile" onclick="location.href='/'">⌂</button>
      </div>
    </header>
    <section class="messages" id="messages"><div class="empty">Pilih karakter dari Home untuk memulai percakapan.</div></section>
    <div class="composer-wrap"><div class="composer"><button id="starBtn" title="Aksi / narasi">*</button><textarea id="messageInput" rows="1" placeholder="Ketik pesan..."></textarea><button class="send" id="sendBtn">➤</button></div></div>
  </main>
</div>

<div class="sheet-backdrop" id="modelBackdrop">
  <section class="model-sheet" role="dialog" aria-modal="true" aria-labelledby="modelTitle">
    <div class="sheet-head">
      <div><div class="sheet-title" id="modelTitle">Pilih model</div><div class="sheet-sub">Model mengikuti daftar terbaru dari konfigurasi SpicyChat.</div></div>
      <button class="close-sheet" id="closeModelBtn">✕</button>
    </div>
    <div class="model-search"><input id="modelSearch" placeholder="Cari model..." /></div>
    <div class="model-list" id="modelList"><div class="model-empty">Memuat model...</div></div>
    <div class="settings-hint">Model dengan label akses tertentu mungkin membutuhkan paket atau permission pada akun SpicyChat-mu.</div>
  </section>
</div>

<script>
let currentConvo=null;
let models=[];
let currentModelId='stheno-8b';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function formatMessage(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')}
function avatarUrl(c){return c?.avatar_url?'/api/avatar?url='+encodeURIComponent(c.avatar_url):''}
function setCharacter(c){const id=c?.character_id||c?.id;if(!id)return;currentConvo={id:null,character_id:id,character:c};$('charName').textContent=c.name||'Character';$('charSub').textContent=c.creator_username?'@'+c.creator_username:'SpicyChat character';$('charAvatar').src=avatarUrl(c);$('messages').innerHTML='<div class="empty">Mulai chat dengan '+esc(c.name||'karakter')+'.</div>'}
function addMessage(text,type='bot'){const empty=$('messages').querySelector('.empty');if(empty)empty.remove();const row=document.createElement('div');row.className='msg '+type;row.innerHTML='<div class="bubble">'+formatMessage(text)+'</div>';$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight;return row}
async function loadConversations(){try{const r=await fetch('/api/conversations');const d=await r.json();const list=Array.isArray(d)?d:(d.conversations||d.data||[]);$('conversationList').innerHTML='';if(!list.length){$('conversationList').innerHTML='<div class="convo-preview" style="padding:12px">Belum ada chat.</div>';return}list.forEach(c=>{const el=document.createElement('div');el.className='convo';const ch=c.character||{};el.innerHTML='<div class="convo-name">'+esc(ch.name||c.name||'Conversation')+'</div><div class="convo-preview">'+esc(c.last_message?.content||c.last_message||'Buka percakapan')+'</div>';el.onclick=()=>{currentConvo={id:c.id||c.conversation_id,character_id:c.character_id||ch.id||ch.character_id,character:ch};$('charName').textContent=ch.name||c.name||'Conversation';$('charAvatar').src=avatarUrl(ch);$('messages').innerHTML='<div class="empty">Percakapan dipilih. Kirim pesan untuk melanjutkan.</div>';closeDrawer()};$('conversationList').appendChild(el)})}catch(e){$('conversationList').innerHTML='<div class="convo-preview" style="padding:12px">Gagal memuat riwayat.</div>'}}
async function sendMessage(){if(!currentConvo){addMessage('Pilih karakter dari Home terlebih dahulu.','error');return}const input=$('messageInput');const text=input.value.trim();if(!text)return;input.value='';autoGrow();addMessage(text,'user');const loading=addMessage('Mengetik...','bot');$('sendBtn').disabled=true;try{const body={message:text,character_id:currentConvo.character_id};if(currentConvo.id)body.conversation_id=currentConvo.id;const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'HTTP '+r.status);currentConvo.id=d.conversation_id||currentConvo.id;loading.querySelector('.bubble').innerHTML=formatMessage(d.content||'')}catch(e){loading.classList.add('error');loading.querySelector('.bubble').textContent='Error: '+e.message}finally{$('sendBtn').disabled=false;$('messages').scrollTop=$('messages').scrollHeight}}
function autoGrow(){const t=$('messageInput');t.style.height='42px';t.style.height=Math.min(t.scrollHeight,150)+'px'}
function closeDrawer(){$('sidebar').classList.remove('open');$('backdrop').classList.remove('show')}
function openModelSheet(){$('modelBackdrop').classList.add('show');$('modelSearch').value='';renderModels();setTimeout(()=>$('modelSearch').focus(),50)}
function closeModelSheet(){$('modelBackdrop').classList.remove('show')}
function modelDisplayName(id){const m=models.find(x=>x.id===id);return m?.name||id||'Model'}
function updateModelLabel(){$('modelLabel').textContent=modelDisplayName(currentModelId)}
function badge(text,cls=''){return '<span class="badge '+cls+'">'+esc(text)+'</span>'}
function renderModels(){const q=$('modelSearch').value.trim().toLowerCase();const filtered=models.filter(m=>!q||[m.name,m.id,m.description,m.level,m.size].some(v=>String(v||'').toLowerCase().includes(q)));if(!filtered.length){$('modelList').innerHTML='<div class="model-empty">Model tidak ditemukan.</div>';return}$('modelList').innerHTML=filtered.map(m=>{const isActive=m.id===currentModelId;const badges=[m.size&&badge(m.size),m.tokens&&badge(m.tokens),m.level&&badge(m.level,'access'),m.tag&&badge(m.tag,'new')].filter(Boolean).join('');return '<button class="model-card '+(isActive?'active':'')+'" data-model-id="'+esc(m.id)+'"><div class="model-row"><div><div class="model-name">'+esc(m.name||m.id)+'</div><div class="model-badges">'+badges+'</div><div class="model-desc">'+esc(m.description||'')+'</div></div><div class="model-check">'+(isActive?'✓':'')+'</div></div></button>'}).join('');document.querySelectorAll('.model-card').forEach(el=>el.onclick=()=>selectModel(el.dataset.modelId))}
async function selectModel(id){const previous=currentModelId;currentModelId=id;updateModelLabel();renderModels();try{const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model_id:id})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Gagal menyimpan model');closeModelSheet()}catch(e){currentModelId=previous;updateModelLabel();renderModels();alert(e.message)}}
async function loadModels(){try{const [mr,sr]=await Promise.all([fetch('/api/models'),fetch('/api/settings')]);const md=await mr.json();const sd=await sr.json();models=Array.isArray(md)?md:[];currentModelId=sd.model_id||'stheno-8b';updateModelLabel();renderModels()}catch(e){$('modelList').innerHTML='<div class="model-empty">Gagal memuat daftar model.</div>';updateModelLabel()}}
$('menuBtn').onclick=()=>{$('sidebar').classList.add('open');$('backdrop').classList.add('show')};$('backdrop').onclick=closeDrawer;
$('starBtn').onclick=()=>{const t=$('messageInput');const a=t.selectionStart,b=t.selectionEnd;if(a!==b){t.setRangeText('*'+t.value.slice(a,b)+'*',a,b,'end')}else{t.value=t.value.startsWith('*')&&t.value.endsWith('*')?t.value.slice(1,-1):'*'+t.value+'*'}t.focus();autoGrow()};
$('sendBtn').onclick=sendMessage;$('messageInput').addEventListener('input',autoGrow);$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
$('modelBtn').onclick=openModelSheet;$('closeModelBtn').onclick=closeModelSheet;$('modelBackdrop').addEventListener('click',e=>{if(e.target===$('modelBackdrop'))closeModelSheet()});$('modelSearch').addEventListener('input',renderModels);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModelSheet()});
try{const raw=sessionStorage.getItem('pendingCharacter');if(raw){sessionStorage.removeItem('pendingCharacter');setCharacter(JSON.parse(raw))}}catch(e){}
loadConversations();loadModels();
if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
</script>
</body>
</html>
